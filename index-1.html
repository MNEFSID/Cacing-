<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cacing.io</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  @font-face { font-family: 'DisplayFont'; src: local('Arial Black'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #060a10;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #game { display: block; background: #060a10; cursor: crosshair; }

  .screen {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0d1420 0%, #060a10 70%);
    z-index: 20;
    padding: 20px;
  }
  .screen.visible { display: flex; }

  .logo {
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 58px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #39ff88, #35e2ff, #ff3df0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(53,226,255,0.35));
    margin-bottom: 4px;
    text-align: center;
  }
  .tagline {
    color: #5f7285; font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 28px; text-align: center;
  }

  .card {
    width: 100%; max-width: 320px;
    background: rgba(11,18,27,0.7);
    border: 1px solid #1c2733;
    border-radius: 16px;
    padding: 26px 24px;
    backdrop-filter: blur(6px);
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tabBtn {
    flex: 1; padding: 10px; text-align: center;
    border-radius: 8px; cursor: pointer;
    color: #5f7285; font-size: 13px; font-weight: 700; letter-spacing: 1px;
    border: 1px solid #1c2733; background: transparent;
    transition: all .15s;
  }
  .tabBtn.active {
    color: #04101a; background: linear-gradient(90deg, #39ff88, #35e2ff);
    border-color: transparent;
  }

  input {
    width: 100%; padding: 13px 16px; font-size: 15px;
    border-radius: 10px; border: 2px solid #1c2733;
    background: #0b121b; color: #e6f1f8; outline: none;
    margin-bottom: 12px; transition: border-color .2s;
  }
  input:focus { border-color: #35e2ff; }

  .btnPrimary {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 700; letter-spacing: 1px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, #39ff88, #35e2ff); color: #04101a;
    box-shadow: 0 0 22px rgba(57,255,136,0.3);
    transition: transform .12s;
  }
  .btnPrimary:hover { transform: translateY(-2px); }
  .btnPrimary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btnGhost {
    width: 100%; padding: 12px; font-size: 13px; font-weight: 600;
    border: 1px solid #1c2733; border-radius: 10px; cursor: pointer;
    background: transparent; color: #8aa0b3; margin-top: 10px;
  }

  .errMsg {
    color: #ff3d6a; font-size: 12px; margin: -4px 0 12px 2px; min-height: 14px;
  }

  /* ---------- Lobby ---------- */
  .userBadge {
    display: flex; align-items: center; gap: 10px;
    background: rgba(11,18,27,0.7); border: 1px solid #1c2733;
    border-radius: 12px; padding: 12px 18px; margin-bottom: 22px;
  }
  .userAvatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #39ff88, #35e2ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #04101a; font-size: 16px;
  }
  .userInfo .uname { font-size: 15px; font-weight: 700; color: #e6f1f8; }
  .userInfo .ulevel { font-size: 11px; color: #5f7285; }

  .serverCard {
    width: 100%; max-width: 320px;
    background: rgba(11,18,27,0.7); border: 1px solid #1c2733;
    border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .serverCard .sName { font-weight: 700; font-size: 15px; color: #e6f1f8; }
  .serverCard .sSlot { font-size: 12px; color: #5f7285; margin-top: 3px; }
  .serverCard .sSlot.full { color: #ff3d6a; }
  .joinBtn {
    padding: 10px 20px; border: none; border-radius: 8px;
    background: linear-gradient(90deg, #39ff88, #35e2ff);
    color: #04101a; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .joinBtn:disabled { background: #1c2733; color: #5f7285; cursor: not-allowed; }

  .logoutLink {
    margin-top: 18px; color: #4a5b6b; font-size: 12px; cursor: pointer; text-decoration: underline;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 16px; left: 16px; color: #dceaf4; z-index: 10; font-size: 13px; display: none;
  }
  #hud .score {
    font-family: Impact, 'Arial Black', sans-serif; font-size: 30px; color: #39ff88;
    text-shadow: 0 0 12px rgba(57,255,136,0.5);
  }
  #leaderboard {
    position: fixed; top: 16px; right: 16px; width: 190px;
    background: rgba(9,14,20,0.72); border: 1px solid #1c2733; border-radius: 10px;
    padding: 10px 14px; color: #cfe0ec; font-size: 12px; z-index: 10; display: none;
    backdrop-filter: blur(4px);
  }
  #leaderboard h3 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #5f7285; margin-bottom: 8px; font-weight: 600; }
  #leaderboard div.row { display: flex; justify-content: space-between; padding: 3px 0; }
  #leaderboard div.row.me { color: #39ff88; font-weight: 700; }

  #minimapWrap {
    position: fixed; bottom: 16px; right: 16px; width: 130px; height: 130px;
    border-radius: 8px; border: 1px solid #1c2733; background: rgba(9,14,20,0.72); z-index: 10; display: none;
  }

  #boostBar {
    position: fixed; bottom: 20px; left: 16px; width: 140px; height: 10px;
    border-radius: 6px; background: rgba(9,14,20,0.72); border: 1px solid #1c2733;
    z-index: 10; display: none; overflow: hidden;
  }
  #boostFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3df0, #35e2ff); }

  #boostBtn {
    position: fixed; bottom: 26px; right: 24px; width: 78px; height: 78px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6bd6, #ff3df0 60%, #b520a3);
    border: 3px solid rgba(255,255,255,0.35); color: #fff; font-weight: 800; font-size: 13px;
    letter-spacing: 1px; z-index: 15; display: none; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(255,61,240,0.45); user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #boostBtn.active { transform: scale(0.92); box-shadow: 0 0 34px rgba(255,61,240,0.75); }
  #joystickZone { position: fixed; inset: 0; z-index: 5; touch-action: none; display: none; }
  #joyBase, #joyStick { position: fixed; display: none; border-radius: 50%; pointer-events: none; z-index: 14; }
  #joyBase { width: 100px; height: 100px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); margin-left: -50px; margin-top: -50px; }
  #joyStick { width: 46px; height: 46px; background: rgba(53,226,255,0.55); border: 2px solid rgba(255,255,255,0.6); margin-left: -23px; margin-top: -23px; }

  #deathScreen h2 {
    font-family: Impact, 'Arial Black', sans-serif; font-size: 44px; color: #ff3d6a; margin-bottom: 6px; text-align: center;
  }
  #deathScreen .expGain { color: #39ff88; font-size: 14px; margin-bottom: 4px; }
  #deathScreen p { color: #8aa0b3; margin-bottom: 22px; font-size: 14px; text-align: center; }
  #deathScreen .btnRow { display: flex; gap: 10px; width: 100%; max-width: 320px; }

  .connMsg {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(9,14,20,0.85); border: 1px solid #1c2733; color: #8aa0b3;
    font-size: 12px; padding: 8px 16px; border-radius: 20px; z-index: 30; display: none;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div class="connMsg" id="connMsg">Menyambung ke server...</div>

<!-- AUTH SCREEN -->
<div class="screen visible" id="authScreen">
  <div class="logo">CACING.IO</div>
  <div class="tagline">makan • tumbuh • jangan nabrak</div>
  <div class="card">
    <div class="tabs">
      <div class="tabBtn active" id="tabLogin">MASUK</div>
      <div class="tabBtn" id="tabRegister">DAFTAR</div>
    </div>
    <input id="authName" maxlength="14" placeholder="Nama">
    <input id="authPass" type="password" maxlength="32" placeholder="Password">
    <div class="errMsg" id="authErr"></div>
    <button class="btnPrimary" id="authSubmit">MASUK</button>
  </div>
</div>

<!-- LOBBY SCREEN -->
<div class="screen" id="lobbyScreen">
  <div class="logo" style="font-size:40px;margin-bottom:18px;">LOBBY</div>
  <div class="userBadge">
    <div class="userAvatar" id="lobbyAvatar">?</div>
    <div class="userInfo">
      <div class="uname" id="lobbyName">-</div>
      <div class="ulevel" id="lobbyLevel">Level 1 • 0 EXP</div>
    </div>
  </div>
  <div class="serverCard">
    <div>
      <div class="sName">Server 1</div>
      <div class="sSlot" id="server1Slot">.../20 pemain</div>
    </div>
    <button class="joinBtn" id="joinServer1">MAIN</button>
  </div>
  <div class="logoutLink" id="logoutLink">Keluar akun</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="score">0</div>
  <div style="color:#5f7285;font-size:11px;letter-spacing:1px;">PANJANG</div>
</div>
<div id="leaderboard"><h3>Papan Skor</h3><div id="lbRows"></div></div>
<div id="minimapWrap"><canvas id="minimap" width="130" height="130"></canvas></div>
<div id="boostBar"><div id="boostFill"></div></div>
<div id="joystickZone"></div>
<div id="joyBase"></div>
<div id="joyStick"></div>
<div id="boostBtn">BOOST</div>

<!-- DEATH SCREEN -->
<div class="screen" id="deathScreen">
  <h2>KAMU MATI</h2>
  <div class="expGain" id="expGain">+0 EXP</div>
  <p id="deathStats">Panjang akhir: 0 • Peringkat: -</p>
  <div class="btnRow">
    <button class="btnPrimary" id="respawnBtn">MAIN LAGI</button>
    <button class="btnGhost" id="toLobbyBtn">KE LOBBY</button>
  </div>
</div>

<script>
(() => {
  // ================= FIREBASE SETUP =================
  const firebaseConfig = {
    apiKey: "AIzaSyCJxJtA7ga5_FGOLdts2ULxNoEO7cp-JrA",
    authDomain: "cacing-661f1.firebaseapp.com",
    databaseURL: "https://cacing-661f1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cacing-661f1",
    storageBucket: "cacing-661f1.firebasestorage.app",
    messagingSenderId: "579218724882",
    appId: "1:579218724882:web:12bd8ee9f52090a0f860cb"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function showConnMsg(show, text) {
    const el = document.getElementById('connMsg');
    el.style.display = show ? 'block' : 'none';
    if (text) el.textContent = text;
  }

  // simple non-cryptographic hash - fine for a casual hobby project only
  function simpleHash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
    return (h >>> 0).toString(36);
  }
  function sanitizeKey(name) {
    return name.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g, '_').slice(0, 24);
  }

  // ================= AUTH LOGIC =================
  let currentUser = null; // { uid, name, exp, level }
  let authMode = 'login';

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const authSubmit = document.getElementById('authSubmit');
  const authErr = document.getElementById('authErr');

  tabLogin.addEventListener('click', () => setAuthMode('login'));
  tabRegister.addEventListener('click', () => setAuthMode('register'));

  function setAuthMode(mode) {
    authMode = mode;
    tabLogin.classList.toggle('active', mode === 'login');
    tabRegister.classList.toggle('active', mode === 'register');
    authSubmit.textContent = mode === 'login' ? 'MASUK' : 'DAFTAR';
    authErr.textContent = '';
  }

  authSubmit.addEventListener('click', async () => {
    const nameRaw = document.getElementById('authName').value;
    const pass = document.getElementById('authPass').value;
    authErr.textContent = '';

    if (!nameRaw.trim() || nameRaw.trim().length < 3) { authErr.textContent = 'Nama minimal 3 karakter'; return; }
    if (!pass || pass.length < 4) { authErr.textContent = 'Password minimal 4 karakter'; return; }

    const uid = sanitizeKey(nameRaw);
    authSubmit.disabled = true;
    authSubmit.textContent = 'Memproses...';

    try {
      const snap = await db.ref('users/' + uid).once('value');
      const existing = snap.val();

      if (authMode === 'register') {
        if (existing) { authErr.textContent = 'Nama sudah dipakai, pilih nama lain'; resetSubmitBtn(); return; }
        const userData = {
          name: nameRaw.trim(),
          passHash: simpleHash(pass),
          exp: 0,
          level: 1,
          createdAt: Date.now()
        };
        await db.ref('users/' + uid).set(userData);
        currentUser = { uid, ...userData };
        enterLobby();
      } else {
        if (!existing) { authErr.textContent = 'Akun tidak ditemukan, coba daftar'; resetSubmitBtn(); return; }
        if (existing.passHash !== simpleHash(pass)) { authErr.textContent = 'Password salah'; resetSubmitBtn(); return; }
        currentUser = { uid, ...existing };
        enterLobby();
      }
    } catch (e) {
      authErr.textContent = 'Gagal menyambung ke server. Coba lagi.';
      resetSubmitBtn();
    }
  });

  function resetSubmitBtn() {
    authSubmit.disabled = false;
    authSubmit.textContent = authMode === 'login' ? 'MASUK' : 'DAFTAR';
  }

  // ================= LOBBY LOGIC =================
  const SERVER_ID = 'server1';
  const MAX_PLAYERS = 20;
  let serverCountRef = null;

  function enterLobby() {
    document.getElementById('authScreen').classList.remove('visible');
    document.getElementById('lobbyScreen').classList.add('visible');
    document.getElementById('lobbyAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
    document.getElementById('lobbyName').textContent = currentUser.name;
    document.getElementById('lobbyLevel').textContent = `Level ${currentUser.level} • ${currentUser.exp} EXP`;
    watchServerCount();
  }

  function watchServerCount() {
    if (serverCountRef) serverCountRef.off();
    serverCountRef = db.ref('servers/' + SERVER_ID + '/players');
    serverCountRef.on('value', snap => {
      const n = snap.exists() ? Object.keys(snap.val()).length : 0;
      const el = document.getElementById('server1Slot');
      el.textContent = n + '/' + MAX_PLAYERS + ' pemain';
      el.classList.toggle('full', n >= MAX_PLAYERS);
      document.getElementById('joinServer1').disabled = n >= MAX_PLAYERS;
    });
  }

  document.getElementById('joinServer1').addEventListener('click', async () => {
    const snap = await db.ref('servers/' + SERVER_ID + '/players').once('value');
    const n = snap.exists() ? Object.keys(snap.val()).length : 0;
    if (n >= MAX_PLAYERS) return;
    document.getElementById('lobbyScreen').classList.remove('visible');
    startGame();
  });

  document.getElementById('logoutLink').addEventListener('click', () => {
    if (serverCountRef) serverCountRef.off();
    currentUser = null;
    document.getElementById('lobbyScreen').classList.remove('visible');
    document.getElementById('authScreen').classList.add('visible');
    document.getElementById('authName').value = '';
    document.getElementById('authPass').value = '';
  });

  document.getElementById('toLobbyBtn').addEventListener('click', () => {
    document.getElementById('deathScreen').classList.remove('visible');
    enterLobby();
    document.getElementById('lobbyScreen').classList.add('visible');
  });

  // ================= GAME ENGINE =================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const minimap = document.getElementById('minimap');
  const mctx = minimap.getContext('2d');

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  const WORLD = { w: 4200, h: 4200 };
  const FOOD_TARGET = 260;
  const START_LEN = 10;

  let food = {}; // keyed by firebase id
  let worms = []; // {id, name, isRemote, ...}
  let particles = [];
  let camera = { x: 0, y: 0 };
  let mouse = { x: 0, y: 0 };
  let boosting = false;
  let running = false;
  let playerId = null;
  let animFrame = null;
  let playersRef = null, foodRef = null, myPlayerRef = null;
  let lastNetPush = 0;

  const NEON = ['#39ff88', '#35e2ff', '#ff3df0', '#ffd93d', '#ff6b3d', '#7dff35', '#3dc9ff', '#ff3d6a'];
  function rand(a, b) { return a + Math.random() * (b - a); }
  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function angleDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }

  function makeWormObj(id, name, isRemote, x, y, color) {
    const segs = [];
    for (let i = 0; i < START_LEN; i++) segs.push({ x: x - i * 6, y: y });
    return {
      id, name, isRemote,
      color: color || NEON[Math.floor(Math.random() * NEON.length)],
      segs, angle: 0, targetAngle: 0, speed: 2.4,
      boosting: false, alive: true, len: START_LEN, boostFuel: 100,
      lastPos: { x, y }, targetPos: { x, y }, lastUpdateT: performance.now(), updateInterval: 100
    };
  }

  function getPlayer() { return worms.find(w => w.id === playerId); }

  // ---- input ----
  canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener('mousedown', () => boosting = true);
  canvas.addEventListener('mouseup', () => boosting = false);
  window.addEventListener('keydown', e => { if (e.code === 'Space') { boosting = true; e.preventDefault(); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { boosting = false; } });

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const joystickZone = document.getElementById('joystickZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  const boostBtn = document.getElementById('boostBtn');
  let joyActive = false, joyOrigin = { x: 0, y: 0 }, joyTouchId = null, touchAngle = null;
  const JOY_RADIUS = 55;

  function startJoystick(x, y, id) {
    joyActive = true; joyTouchId = id; joyOrigin = { x, y };
    joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px';
    joyStick.style.left = x + 'px'; joyStick.style.top = y + 'px';
    joyBase.style.display = 'block'; joyStick.style.display = 'block';
  }
  function moveJoystick(x, y) {
    if (!joyActive) return;
    let dx = x - joyOrigin.x, dy = y - joyOrigin.y;
    const d = Math.min(JOY_RADIUS, Math.hypot(dx, dy));
    const ang = Math.atan2(dy, dx);
    joyStick.style.left = (joyOrigin.x + Math.cos(ang) * d) + 'px';
    joyStick.style.top = (joyOrigin.y + Math.sin(ang) * d) + 'px';
    if (Math.hypot(dx, dy) > 6) touchAngle = ang;
  }
  function endJoystick() { joyActive = false; joyTouchId = null; joyBase.style.display = 'none'; joyStick.style.display = 'none'; }

  joystickZone.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (t.clientX > canvas.width - 110 && t.clientY > canvas.height - 130) continue;
      if (!joyActive) startJoystick(t.clientX, t.clientY, t.identifier);
    }
  }, { passive: true });
  joystickZone.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) if (t.identifier === joyTouchId) moveJoystick(t.clientX, t.clientY);
  }, { passive: true });
  function handleTouchEnd(e) { for (const t of e.changedTouches) if (t.identifier === joyTouchId) endJoystick(); }
  joystickZone.addEventListener('touchend', handleTouchEnd, { passive: true });
  joystickZone.addEventListener('touchcancel', handleTouchEnd, { passive: true });
  boostBtn.addEventListener('touchstart', e => { e.stopPropagation(); boosting = true; boostBtn.classList.add('active'); }, { passive: true });
  boostBtn.addEventListener('touchend', e => { e.stopPropagation(); boosting = false; boostBtn.classList.remove('active'); }, { passive: true });

  // ---- local update ----
  function updateLocalWorm(w) {
    if (!w.alive) return;
    if (isTouch) { if (touchAngle !== null) w.targetAngle = touchAngle; }
    else {
      const dx = mouse.x - canvas.width / 2, dy = mouse.y - canvas.height / 2;
      if (dx * dx + dy * dy > 25) w.targetAngle = Math.atan2(dy, dx);
    }
    w.boosting = boosting && w.len > 6;

    w.angle += angleDiff(w.angle, w.targetAngle) * 0.09;
    let spd = w.speed;
    if (w.boosting && w.boostFuel > 0) {
      spd *= 1.9; w.boostFuel -= 1.2; w.len = Math.max(START_LEN, w.len - 0.03);
      if (Math.random() < 0.3) particles.push({ x: w.segs[w.segs.length - 1].x, y: w.segs[w.segs.length - 1].y, r: 3, color: w.color, life: 20 });
    } else {
      w.boostFuel = Math.min(100, w.boostFuel + 0.4);
      if (w.boostFuel <= 0) w.boosting = false;
    }

    const head = w.segs[0];
    let nx = head.x + Math.cos(w.angle) * spd, ny = head.y + Math.sin(w.angle) * spd;
    const margin = 30;
    if (nx < margin) w.targetAngle = 0;
    if (nx > WORLD.w - margin) w.targetAngle = Math.PI;
    if (ny < margin) w.targetAngle = Math.PI / 2;
    if (ny > WORLD.h - margin) w.targetAngle = -Math.PI / 2;
    nx = Math.max(4, Math.min(WORLD.w - 4, nx));
    ny = Math.max(4, Math.min(WORLD.h - 4, ny));

    w.segs.unshift({ x: nx, y: ny });
    const targetSegCount = Math.max(START_LEN, Math.floor(w.len));
    while (w.segs.length > targetSegCount) w.segs.pop();

    for (const fid in food) {
      const f = food[fid];
      if (dist2(nx, ny, f.x, f.y) < (f.r + 10) * (f.r + 10)) {
        w.len += 0.5;
        db.ref('servers/' + SERVER_ID + '/food/' + fid).remove();
        delete food[fid];
        spawnFoodIfNeeded(1);
      }
    }
  }

  function spawnFoodIfNeeded(n) {
    for (let i = 0; i < n; i++) {
      const nf = { x: rand(40, WORLD.w - 40), y: rand(40, WORLD.h - 40), r: rand(3, 6), color: NEON[Math.floor(Math.random() * NEON.length)] };
      db.ref('servers/' + SERVER_ID + '/food').push(nf);
    }
  }

  // ---- remote worm interpolation ----
  function updateRemoteWorm(w) {
    if (!w.alive) return;
    const now = performance.now();
    const t = Math.min(1, (now - w.lastUpdateT) / w.updateInterval);
    const cx = w.lastPos.x + (w.targetPos.x - w.lastPos.x) * t;
    const cy = w.lastPos.y + (w.targetPos.y - w.lastPos.y) * t;
    const head = w.segs[0];
    if (dist2(head.x, head.y, cx, cy) > 1) {
      w.segs.unshift({ x: cx, y: cy });
      const targetSegCount = Math.max(START_LEN, Math.floor(w.len));
      while (w.segs.length > targetSegCount) w.segs.pop();
    }
  }

  // ---- collisions (local player only checks itself) ----
  function checkCollisions() {
    const p = getPlayer();
    if (!p || !p.alive) return;
    const head = p.segs[0], headR = 9;
    for (const other of worms) {
      if (!other.alive) continue;
      const startIdx = other === p ? 8 : 0;
      for (let i = startIdx; i < other.segs.length; i++) {
        const s = other.segs[i];
        if (dist2(head.x, head.y, s.x, s.y) < (headR + 6) * (headR + 6)) { killLocalPlayer(); return; }
      }
    }
  }

  async function killLocalPlayer() {
    const p = getPlayer();
    if (!p || !p.alive) return;
    p.alive = false;
    running = false;
    cancelAnimationFrame(animFrame);

    const expGain = Math.floor(p.len);
    const ranked = [...worms].sort((a, b) => b.len - a.len);
    const rank = ranked.findIndex(w => w.id === playerId) + 1;

    if (myPlayerRef) myPlayerRef.remove();

    try {
      const uref = db.ref('users/' + currentUser.uid);
      const snap = await uref.once('value');
      const u = snap.val() || currentUser;
      const newExp = (u.exp || 0) + expGain;
      const newLevel = Math.floor(newExp / 100) + 1;
      await uref.update({ exp: newExp, level: newLevel });
      currentUser.exp = newExp; currentUser.level = newLevel;
    } catch (e) {}

    document.getElementById('expGain').textContent = '+' + expGain + ' EXP';
    document.getElementById('deathStats').textContent = `Panjang akhir: ${Math.floor(p.len)} • Peringkat: ${rank} dari ${worms.length}`;
    document.getElementById('deathScreen').classList.add('visible');
    hideGameUI();
    detachServerListeners();
  }

  function hideGameUI() {
    document.getElementById('hud').style.display = 'none';
    document.getElementById('leaderboard').style.display = 'none';
    document.getElementById('minimapWrap').style.display = 'none';
    document.getElementById('boostBar').style.display = 'none';
    document.getElementById('joystickZone').style.display = 'none';
    boostBtn.style.display = 'none';
  }

  // ---- rendering ----
  function drawGrid() {
    const gridSize = 60;
    ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
    const startX = -((camera.x) % gridSize), startY = -((camera.y) % gridSize);
    for (let x = startX; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (let y = startY; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  }
  function drawBoundary() {
    ctx.strokeStyle = 'rgba(255,61,106,0.5)'; ctx.lineWidth = 4;
    ctx.strokeRect(-camera.x, -camera.y, WORLD.w, WORLD.h);
  }
  function worldToScreen(x, y) { return { x: x - camera.x, y: y - camera.y }; }

  function drawFood() {
    for (const fid in food) {
      const f = food[fid];
      const s = worldToScreen(f.x, f.y);
      if (s.x < -20 || s.x > canvas.width + 20 || s.y < -20 || s.y > canvas.height + 20) continue;
      f.pulse = (f.pulse || 0) + 0.06;
      const r = f.r + Math.sin(f.pulse) * 1.2;
      ctx.beginPath(); ctx.fillStyle = f.color; ctx.shadowColor = f.color; ctx.shadowBlur = 8;
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life--; if (p.life <= 0) { particles.splice(i, 1); continue; }
      const s = worldToScreen(p.x, p.y);
      ctx.globalAlpha = p.life / 20;
      ctx.beginPath(); ctx.fillStyle = p.color; ctx.arc(s.x, s.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  function drawWorm(w) {
    if (!w.alive) return;
    const segR = 8 + Math.min(10, w.len * 0.05);
    for (let i = w.segs.length - 1; i >= 0; i--) {
      const seg = w.segs[i]; const s = worldToScreen(seg.x, seg.y);
      if (s.x < -40 || s.x > canvas.width + 40 || s.y < -40 || s.y > canvas.height + 40) continue;
      ctx.beginPath(); ctx.fillStyle = w.color; ctx.globalAlpha = i === 0 ? 1 : 0.88;
      ctx.arc(s.x, s.y, i === 0 ? segR + 2 : segR, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const head = worldToScreen(w.segs[0].x, w.segs[0].y);
    const ex = Math.cos(w.angle), ey = Math.sin(w.angle);
    const perpX = -ey, perpY = ex;
    for (const side of [-1, 1]) {
      const ox = head.x + ex * segR * 0.6 + perpX * side * segR * 0.5;
      const oy = head.y + ey * segR * 0.6 + perpY * side * segR * 0.5;
      ctx.beginPath(); ctx.fillStyle = '#fff'; ctx.arc(ox, oy, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.fillStyle = '#111'; ctx.arc(ox + ex * 1.2, oy + ey * 1.2, 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.font = '12px Segoe UI, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.textAlign = 'center';
    ctx.fillText(w.name, head.x, head.y - segR - 10);
  }
  function drawMinimap() {
    mctx.clearRect(0, 0, 130, 130);
    mctx.fillStyle = 'rgba(20,28,38,0.5)'; mctx.fillRect(0, 0, 130, 130);
    const scale = 130 / WORLD.w;
    for (const w of worms) {
      if (!w.alive) continue;
      const h = w.segs[0];
      mctx.beginPath(); mctx.fillStyle = w.id === playerId ? '#39ff88' : w.color;
      mctx.globalAlpha = w.id === playerId ? 1 : 0.55;
      mctx.arc(h.x * scale, h.y * scale, w.id === playerId ? 3.5 : 2, 0, Math.PI * 2); mctx.fill();
    }
    mctx.globalAlpha = 1;
  }
  function updateHUD() {
    const p = getPlayer(); if (!p) return;
    document.querySelector('#hud .score').textContent = Math.floor(p.len);
    document.getElementById('boostFill').style.width = p.boostFuel + '%';
    const ranked = [...worms].sort((a, b) => b.len - a.len).slice(0, 8);
    document.getElementById('lbRows').innerHTML = ranked.map((w, i) =>
      `<div class="row ${w.id === playerId ? 'me' : ''}"><span>${i + 1}. ${w.name}</span><span>${Math.floor(w.len)}</span></div>`
    ).join('');
  }

  // ---- network push (throttled) ----
  function pushLocalStateToFirebase(now) {
    if (!myPlayerRef) return;
    if (now - lastNetPush < 100) return;
    lastNetPush = now;
    const p = getPlayer();
    if (!p || !p.alive) return;
    myPlayerRef.update({
      x: p.segs[0].x, y: p.segs[0].y, angle: p.angle,
      len: p.len, alive: true, updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }

  function loop(ts) {
    if (!running) return;
    const p = getPlayer();
    if (p) updateLocalWorm(p);
    for (const w of worms) { if (w.isRemote) updateRemoteWorm(w); }
    checkCollisions();
    pushLocalStateToFirebase(performance.now());

    if (p && p.alive) { camera.x = p.segs[0].x - canvas.width / 2; camera.y = p.segs[0].y - canvas.height / 2; }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#060a10'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid(); drawBoundary(); drawFood(); drawParticles();
    for (const w of worms) drawWorm(w);
    drawMinimap(); updateHUD();

    animFrame = requestAnimationFrame(loop);
  }

  // ---- firebase server sync ----
  function attachServerListeners() {
    foodRef = db.ref('servers/' + SERVER_ID + '/food');
    foodRef.on('child_added', snap => { food[snap.key] = snap.val(); });
    foodRef.on('child_removed', snap => { delete food[snap.key]; });

    foodRef.once('value', snap => {
      const n = snap.exists() ? Object.keys(snap.val()).length : 0;
      if (n < FOOD_TARGET / 2) spawnFoodIfNeeded(FOOD_TARGET - n);
    });

    playersRef = db.ref('servers/' + SERVER_ID + '/players');
    playersRef.on('child_added', snap => {
      if (snap.key === playerId) return;
      const d = snap.val();
      const w = makeWormObj(snap.key, d.name, true, d.x, d.y, d.color);
      w.angle = d.angle || 0; w.len = d.len || START_LEN;
      w.targetPos = { x: d.x, y: d.y }; w.lastPos = { x: d.x, y: d.y }; w.lastUpdateT = performance.now();
      worms.push(w);
    });
    playersRef.on('child_changed', snap => {
      if (snap.key === playerId) return;
      const d = snap.val();
      const w = worms.find(x => x.id === snap.key);
      if (!w) return;
      w.lastPos = { x: w.segs[0].x, y: w.segs[0].y };
      w.targetPos = { x: d.x, y: d.y };
      w.lastUpdateT = performance.now();
      w.angle = d.angle;
      w.len = d.len;
      w.alive = d.alive;
    });
    playersRef.on('child_removed', snap => {
      worms = worms.filter(w => w.id !== snap.key);
    });
  }

  function detachServerListeners() {
    if (playersRef) playersRef.off();
    if (foodRef) foodRef.off();
  }

  // ---- start game ----
  function startGame() {
    worms = []; food = {}; particles = [];
    playerId = currentUser.uid;
    const px = rand(WORLD.w * 0.3, WORLD.w * 0.7), py = rand(WORLD.h * 0.3, WORLD.h * 0.7);
    const myColor = NEON[Math.floor(Math.random() * NEON.length)];
    const me = makeWormObj(playerId, currentUser.name, false, px, py, myColor);
    worms.push(me);

    myPlayerRef = db.ref('servers/' + SERVER_ID + '/players/' + playerId);
    myPlayerRef.set({ name: currentUser.name, x: px, y: py, angle: 0, len: START_LEN, color: myColor, alive: true, updatedAt: firebase.database.ServerValue.TIMESTAMP });
    myPlayerRef.onDisconnect().remove();

    attachServerListeners();

    document.getElementById('hud').style.display = 'block';
    document.getElementById('leaderboard').style.display = 'block';
    document.getElementById('minimapWrap').style.display = 'block';
    document.getElementById('boostBar').style.display = 'block';
    if (isTouch) { boostBtn.style.display = 'flex'; joystickZone.style.display = 'block'; }

    running = true;
    cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(loop);
  }

  document.getElementById('respawnBtn').addEventListener('click', () => {
    document.getElementById('deathScreen').classList.remove('visible');
    startGame();
  });
})();
</script>
</body>
</html>
